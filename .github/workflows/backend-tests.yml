name: 后台自动测试与 Docker 验收

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'Caddyfile'
      - '.env.example'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'Caddyfile'
      - '.env.example'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python }} 后台回归
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      DATA_DIR: ${{ runner.temp }}/bingjian-test-data
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Python 与依赖缓存
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装并检查锁定依赖
        run: |
          mkdir -p ../build
          python -m pip install -r requirements.txt
          python -m pip check
          python -m compileall -q app tests
      - name: 执行领域、接口与真实进程测试
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee ../build/backend-tests.log
          {
            echo '## 后台自动测试通过'
            echo '覆盖领域计算、认证与权限、同步冲突、AI 协议、归档、实际 HTTP 进程重启及删除任务。'
            echo 'AI 请求使用测试替身，不需要真实接口密钥。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存后台测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-python-${{ matrix.python }}-${{ github.run_number }}
          path: build/backend-tests.log
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker 部署与持久化检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    # 使用云端运行器的本机地址和独立临时数据卷，不依赖部署者的 .env。
    env:
      COMPOSE_PROJECT_NAME: bingjian-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_NAME: localhost
      LAN_BIND: 127.0.0.1
      HTTPS_PORT: '8443'
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 检查部署配置并构建镜像
        run: |
          set -o pipefail
          mkdir -p secrets build
          docker compose config --quiet
          docker compose build api 2>&1 | tee build/docker-build.log
      - name: 启动后台与 HTTPS 代理
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt build/ci-root.crt
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            --cacert build/ci-root.crt https://localhost:8443/api/v1/health > build/health-before.json
          curl --fail --silent --show-error --cacert build/ci-root.crt \
            https://localhost:8443/api/v1/server-info > build/server-before.json
          python -c 'import json; assert json.load(open("build/health-before.json"))["status"] == "ok"'
          docker compose exec -T api python -c 'from pathlib import Path; Path("/data/.ci-persistence-check").write_text("持久化检查", encoding="utf-8")'
      - name: 重建容器并检查数据卷保留
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 120
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            --cacert build/ci-root.crt https://localhost:8443/api/v1/health > build/health-after.json
          curl --fail --silent --show-error --cacert build/ci-root.crt \
            https://localhost:8443/api/v1/server-info > build/server-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("build/server-before.json").read_text())
          after = json.loads(Path("build/server-after.json").read_text())
          assert before["instance_id"] == after["instance_id"]
          assert json.loads(Path("build/health-after.json").read_text())["status"] == "ok"
          print("HTTPS 健康检查通过，重建容器后服务标识保持不变")
          PY
          docker compose exec -T api python -c 'from pathlib import Path; assert Path("/data/.ci-persistence-check").read_text(encoding="utf-8") == "持久化检查"'
          {
            echo '## Docker 部署检查通过'
            echo '已构建镜像，启动 API 与 Caddy，验证受信任的测试 HTTPS 证书和健康接口。'
            echo '重建容器后，服务标识和数据卷中的验证文件均保留。'
            echo '本次仅检查 linux/amd64；真实外部 AI、APNs 与多架构部署仍需另行验收。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 收集容器状态和日志
        if: always()
        run: |
          mkdir -p build
          docker compose ps -a > build/docker-status.log
          docker compose logs --no-color > build/docker-services.log 2>&1
      - name: 清理本次运行的临时容器与数据卷
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: 保存部署验收日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-check-${{ github.run_number }}
          path: |
            build/docker-*.log
            build/health-*.json
            build/server-*.json
          if-no-files-found: warn
          retention-days: 7
