name: iOS 测试包与界面验收

# 按用户要求，页面调整期间不随提交打包；确认完成后手动运行。
on:
  workflow_dispatch:
    inputs:
      create_packages:
        description: '已确认改动完成，生成手机与模拟器测试包'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 iPhone 与 Watch
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查构建环境
        run: |
          mkdir -p build
          {
            xcodebuild -version
            xcodebuild -showsdks
            git rev-parse HEAD
          } | tee build/environment.log
          test -f backend/app/resources/food_schema.json

      - name: 编译真机应用
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BingJian.xcodeproj \
            -scheme BingJian \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build/xcodebuild.log

      - name: 生成待签名 IPA
        if: inputs.create_packages
        run: |
          set -euo pipefail
          app_path='build/DerivedData/Build/Products/Release-iphoneos/BingJian.app'
          test -f "$app_path/BingJian"
          test -f "$app_path/food_schema.json"
          test -d "$app_path/Watch/BingJianWatch.app"
          xcrun lipo "$app_path/BingJian" -verify_arch arm64
          mkdir -p build/package/Payload
          ditto "$app_path" build/package/Payload/BingJian.app
          python3 tools/prepare_ios_resigning.py build/package/Payload/BingJian.app
          (
            cd build/package
            ditto -c -k --keepParent Payload ../BingJian-unsigned.ipa
          )
          unzip -t build/BingJian-unsigned.ipa
          python3 tools/check_ios_health_entitlements.py build/BingJian-unsigned.ipa --allow-prepared | tee build/healthkit-signing-check.log
          (
            cd build
            shasum -a 256 BingJian-unsigned.ipa > BingJian-unsigned.ipa.sha256
          )
          cp docs/Windows安装iOS测试包.md build/安装说明.md
          {
            echo '## 已生成待签名测试包'
            echo '下载构建产物中的 IPA，通过个人 Apple 账号签名后安装。'
            echo '已保留 iPhone 与 Watch 的 HealthKit 签名声明；临时签名不代替个人签名与描述文件。'
            echo '本次构建完成真机代码编译，手机安装、HealthKit 和 Watch 联调仍需验证。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存待签名测试包
        if: inputs.create_packages
        uses: actions/upload-artifact@v7
        with:
          name: BingJian-unsigned-${{ github.run_number }}
          path: |
            build/BingJian-unsigned.ipa
            build/BingJian-unsigned.ipa.sha256
            build/安装说明.md
            build/healthkit-signing-check.log
          if-no-files-found: error
          retention-days: 7

      - name: 保存构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BingJian-build-logs-${{ github.run_number }}
          path: |
            build/environment.log
            build/xcodebuild.log
            build/healthkit-signing-check.log
            build/Build.xcresult
          if-no-files-found: warn
          retention-days: 7

  appearance:
    name: 模拟器测试与页面检查
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 启动 iPhone 模拟器
        run: |
          mkdir -p build
          xcodebuild -version
          xcrun simctl list devices available -j > build/simulators.json
          simulator_id=$(python3 -c 'import json; d=json.load(open("build/simulators.json")); phones=[v for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")]; print(next((v["udid"] for v in phones if v["name"]=="iPhone 16 Pro"), phones[0]["udid"]))')
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: 编译浏览器模拟器应用
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BingJian.xcodeproj \
            -scheme BingJian \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build/simulator-build.log
          app_path=build/SimulatorData/Build/Products/Debug-iphonesimulator/BingJian.app
          xcrun lipo "$app_path/BingJian" -verify_arch arm64
          codesign --verify --deep --strict "$app_path"
          codesign -dv "$app_path" 2> build/simulator-signature.log
          python3 tools/check_simulator_entitlements.py "$app_path" --output build/simulator-entitlements.plist

      - name: 生成浏览器模拟器包
        if: inputs.create_packages
        run: |
          set -euo pipefail
          app_path=build/SimulatorData/Build/Products/Debug-iphonesimulator/BingJian.app
          ditto -c -k --keepParent "$app_path" build/BingJian-simulator.zip
          unzip -t build/BingJian-simulator.zip

      - name: 运行客户端测试与界面截图
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/BingJian.xcodeproj \
            -scheme BingJian \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/SimulatorData \
            -resultBundlePath build/Appearance.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            test 2>&1 | tee build/simulator-tests.log

      - name: 收集页面截图
        if: always()
        run: |
          if [ -d build/Appearance.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Appearance.xcresult --output-path build/ui-interactions
          fi
          if [ -n "$SIMULATOR_ID" ]; then
            app_data=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.bingjian.health data 2>/dev/null || true)
            if [ -d "$app_data/Documents/StyleReview" ]; then
              ditto "$app_data/Documents/StyleReview" build/ui-preview
            fi
          fi

      - name: 保存页面截图与可选模拟器包
        uses: actions/upload-artifact@v7
        with:
          name: BingJian-${{ inputs.create_packages && 'simulator' || 'ui-preview' }}-${{ github.run_number }}
          path: |
            build/BingJian-simulator.zip
            build/ui-preview
            build/ui-interactions
          if-no-files-found: error
          retention-days: 7

      - name: 保存模拟器验收日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BingJian-simulator-logs-${{ github.run_number }}
          path: |
            build/simulator-tests.log
            build/simulator-build.log
            build/simulator-entitlements.plist
            build/simulator-signature.log
            build/Appearance.xcresult
            build/ui-preview
            build/ui-interactions
          retention-days: 7
